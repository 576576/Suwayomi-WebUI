name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - release

jobs:
  release:
    name: Build artifacts and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Compute Version
        id: ver
        shell: bash
        run: |
          cd main
          COUNT="$(git rev-list HEAD --count)"
          if [ "${{ inputs.channel }}" = "release" ]; then
            # 稳定版：commit 数按位拆点成 3.x.y（千位=主版、百位=次版、余下=补丁），
            # 如 r3516 -> 3.5.16，单调递增且可与 r{count} 数字等价比较。
            TAG="$((COUNT/1000)).$(((COUNT/100)%10)).$((COUNT%100))"
          else
            # alpha/beta 保持 r{count}（与旧产物/自动版本比较兼容）
            TAG="r${COUNT}"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version tag: $TAG (channel ${{ inputs.channel }}, commits $COUNT)"

      - name: Set up NodeJs
        uses: actions/setup-node@v7
        with:
          node-version-file: './main/package.json'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11.1.2

      - name: Build webUI
        env:
          CHANNEL: ${{ inputs.channel }}
          SUWAYOMI_WEBUI_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cd main
          pnpm ci
          pnpm build
          case "$CHANNEL" in
            beta) chan="Beta" ;;
            release) chan="Release" ;;
            *) chan="Alpha" ;;
          esac
          SUWAYOMI_WEBUI_CHANNEL="$chan" pnpm build-zip

      - name: Create Tag
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          cd main
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag $TAG
          git push origin $TAG

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          artifacts: "main/buildZip/*"
          tag: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ inputs.channel != 'release' }}
