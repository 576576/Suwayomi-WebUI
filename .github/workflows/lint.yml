name: Lint

# 质量门禁：静态检查 / 格式 / 类型。由 release.yml 与 pr.yml 调起，或手动 dispatch 单跑。
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up NodeJs
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - name: Install modules
        run: pnpm ci

      - name: Run linter
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

      - name: Run TSC
        run: pnpm tsc
